<!DOCTYPE html>
<html lang="om">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lotoorii Martha Gebre</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #1c1c1e; color: white; padding: 15px; margin: 0; }
        h2 { color: #ffd700; }
        .gati { color: #34c759; font-size: 18px; font-weight: bold; margin-bottom: 20px; }
        .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px 0; padding: 10px; background: #2c2c2e; border-radius: 10px; }
        button { padding: 15px 0; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .available { background-color: #34c759; color: white; }
        .taken { background-color: #ff3b30; color: white; text-decoration: line-through; opacity: 0.6; cursor: not-allowed; }
        input { padding: 12px; width: 90%; font-size: 16px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #3a3a3c; background-color: #2c2c2e; color: white; text-align: center; }
    </style>
</head>
<body>
    <h2>🎰 Lotoorii Martha Gebre</h2>
    <div class="gati">Gatii Tikkee: 250 ETB</div>
    <input type="text" id="username" placeholder="Maqaa Keessan Guutaa" required>
    <div class="grid" id="number-grid"></div>
    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); 
        let lakkoofsotaQabaman = []; 
        function renderGrid() {
            const grid = document.getElementById('number-grid');
            grid.innerHTML = '';
            for (let i = 1; i <= 50; i++) {
                const btn = document.createElement('button');
                btn.innerText = i;
                if (lakkoofsotaQabaman.includes(i)) {
                    btn.className = 'taken';
                    btn.disabled = true;
                } else {
                    btn.className = 'available';
                    btn.onclick = function() {
                        const maqaa = document.getElementById('username').value.trim();
                        if (!maqaa) { alert("Maaloo jalqaba maqaa keessan guutaa!"); return; }
                        const data = JSON.stringify({ maqaa: maqaa, lakkoofsa: i });
                        tg.sendData(data);
                        tg.close(); 
                    };
                }
                grid.appendChild(btn);
            }
        }
        renderGrid();
    </script>
</body>
</html>
